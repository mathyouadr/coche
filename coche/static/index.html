<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{TITLE}}">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<link rel="manifest" href="{{BASE}}/manifest.webmanifest">
<link rel="icon" href="{{BASE}}/static/icon.svg?v={{VERSION}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{BASE}}/static/icon-180.png?v={{VERSION}}">
<link rel="stylesheet" href="{{BASE}}/static/app.css?v={{VERSION}}">
<script>window.COCHE_BOOT = {{BOOT}};
(function () { try { var s = JSON.parse(localStorage.getItem("coche-cache") || "null"); var th = s && s.settings && s.settings.theme;
  if (!th || th === "auto") th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = th; } catch (e) {} })();</script>
<!--EXTRA_HEAD-->
</head>
<body>
<noscript>Coche needs JavaScript.</noscript>
<script src="{{BASE}}/static/i18n.js?v={{VERSION}}"></script>
<script src="{{BASE}}/static/outbox.js?v={{VERSION}}"></script>
<script src="{{BASE}}/static/app.js?v={{VERSION}}"></script>
<!--EXTRA_BODY-->
</body>
</html>
